<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Just Us Social Meet</title><link rel="stylesheet" href="styles.css"/></head><body>
<div id="login" class="login-wrap"><div class="login-card"><div class="logo"><span>JU</span><b>Just Us</b></div><h1>Create your ID</h1><p>Search friends, create rooms, video call, screen share, chat, and send disappearing snaps.</p><input id="nameInput" placeholder="Display name"/><input id="idInput" placeholder="Unique ID, e.g. tejash_01"/><input id="avatarInput" placeholder="Avatar initials, e.g. TK" maxlength="4"/><input id="bioInput" placeholder="Short bio/status"/><select id="themeInput"><option value="purple">Purple neon</option><option value="blue">Blue</option><option value="green">Green</option></select><button id="registerBtn">Enter app</button><small>Starter version: IDs are online-session based.</small></div></div>
<div id="app" class="app hidden"><aside class="rail"><div class="brand-mini">JU</div><button id="micBtn" title="Mic">🎙</button><button id="camBtn" title="Camera">⌾</button><button id="screenBtn" title="Share screen">▣</button><button id="snapBtn" title="Send snap">●</button><button id="chatBtn" title="Chat">✉</button><button id="leaveBtn" class="danger" title="Leave">⏻</button></aside>
<main class="stage"><header><div><div class="logo line"><span>JU</span><b>Just Us</b></div><p id="status">Create or join a room.</p></div><div class="top-actions"><input id="roomInput" placeholder="room id"/><input id="passInput" placeholder="password" type="password"/><button id="createRoomBtn">Create room</button><button id="joinRoomBtn">Join</button></div></header><section class="meet-layout"><div class="main-video" id="mainVideo"><div class="empty">No pinned video yet</div></div><div class="tiles" id="tiles"></div></section></main>
<section class="social-panel"><div class="profile-card"><div class="avatar" id="myAvatar">JU</div><div><b id="myName">Name</b><p id="myId">@id</p></div></div><h3>Find friends</h3><div class="search-row"><input id="searchInput" placeholder="Search by ID/name"/><button id="searchBtn">Search</button></div><div id="searchResults" class="results"></div><h3>Room people</h3><div id="peopleList" class="results"></div></section>
<section id="chatDrawer" class="chat-drawer hidden"><div class="drawer-head"><b>Messages</b><select id="targetSelect"><option value="">Everyone</option></select><button id="closeChat">×</button></div><div id="messages" class="messages"></div><div class="composer"><input id="messageInput" placeholder="Message..."/><button id="sendMsgBtn">Send</button></div></section><div id="snapOverlay" class="snap-overlay hidden"></div><input id="snapFile" type="file" accept="image/*,video/*,audio/*" hidden/></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
